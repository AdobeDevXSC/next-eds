version: 1

indices:
  default:
    include:
      - '/**'
    exclude:
      - '/drafts/**'
      - '/config/**'
      - '/nav'
      - '/footer'
    target: /query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, 'content')
      description:
        select: head > meta[name="description"]
        value: attribute(el, 'content')
      image:
        select: head > meta[property="og:image"]
        value: attribute(el, 'content')
      robots:
        select: head > meta[name="robots"]
        value: attribute(el, 'content')
      lastModified:
        select: none
        value: parseTimestamp(headers('last-modified'), 'ddd, DD MMM YYYY hh:mm:ss GMT')
  # Scoped catalog index for menu items authored as content pages under /menu/*. Menu items are
  # authored via DA's schema feature (x-schema-name: menu-item), which renders fields into a
  # .menu-item body block (not page <meta> tags), so each field below is selected directly out of
  # that block. Selectors are anchored to the field's real `id` attribute (e.g. h3#name) via
  # hast-util-select's :has() + adjacent-sibling combinator, so reordering fields in DA's schema
  # editor won't break extraction. See docs/content-schema.md.
  menu:
    include:
      - '/menu/**'
    target: /menu/query-index.json
    properties:
      lastModified:
        select: none
        value: parseTimestamp(headers('last-modified'), 'ddd, DD MMM YYYY hh:mm:ss GMT')
      name:
        select: .menu-item > div > div:has(> h3#name) + div
        value: textContent(el)
      description:
        select: .menu-item > div > div:has(> h3#description) + div
        value: textContent(el)
      image:
        select: .menu-item > div > div:has(> h3#image) + div
        value: textContent(el)
      price:
        select: .menu-item > div > div:has(> h3#price) + div
        value: textContent(el)
      category:
        select: .menu-item > div > div:has(> h3#category) + div
        value: textContent(el)
      tags:
        select: .menu-item > div > div:has(> h3#tags) + div
        value: textContent(el)
      special:
        select: .menu-item > div > div:has(> h3#special) + div
        value: textContent(el)
